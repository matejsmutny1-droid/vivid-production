<title>Vivid Production</title>
<style>
:root{--paper:#f3f1eb;--ink:#20211e;--line:rgba(32,33,30,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{min-height:100svh}.wordmark{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:12px;line-height:1.35;font-weight:600;letter-spacing:.2em;text-align:center;text-decoration:none;color:var(--ink)}main{min-height:100svh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:100px 0 34px}.door{display:flex;align-items:center;justify-content:center;position:relative;text-decoration:none;color:inherit;min-height:calc(100svh - 134px);transition:background .3s ease}.door:not(:last-child){border-right:1px solid var(--line)}.door:hover{background:rgba(255,255,255,.42)}.door:focus-visible{outline:2px solid var(--ink);outline-offset:-8px}.door-cargo:hover{background:#e8eddf}.door p{text-align:center;padding:0 18px;line-height:1.6}.external{font-size:.65em;vertical-align:top}.door-content{display:flex;flex-direction:column;align-items:center;gap:24px;transform:translateY(-5px)}.door svg{width:54px;height:54px;stroke:currentColor;stroke-width:1.15;fill:none;transition:transform .3s ease}.door:hover svg{transform:translateY(-5px)}.door h1{font-weight:400;font-size:clamp(21px,2.1vw,29px);letter-spacing:.02em;margin:0}.door p{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#77776f;margin:0}@media(max-width:650px){.wordmark{top:23px}main{grid-template-columns:1fr;padding:72px 0 20px}.door{min-height:calc((100svh - 92px)/3)}.door:not(:last-child){border-right:0;border-bottom:1px solid var(--line)}.door-content{gap:15px}.door svg{width:43px;height:43px}.door h1{font-size:22px}}
</style>
</head>
<body>
